<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅人北海道 — 北海道 Instagram Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0a0f1c; --navy-mid: #141a2e; --ice: #7ec8e3; --ice-light: #b8e4f2;
      --white: #f8f9fa; --gray: #6c757d;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.10); --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: rgba(10,15,28,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(126,200,227,0.15); }
    .nav-logo { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.25rem; letter-spacing: 0.15em; text-decoration: none; }
    .nav-logo span { color: var(--ice); }
    .nav-ig { display: flex; align-items: center; gap: 8px; color: var(--ice-light); font-size: 0.8rem; text-decoration: none; letter-spacing: 0.05em; transition: color var(--transition); }
    .nav-ig:hover { color: #fff; }
    .nav-ig svg { width: 18px; height: 18px; }
    .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(160deg, #0a0f1c 0%, #0d1f3c 50%, #0a2540 100%); overflow: hidden; padding: 120px 24px 80px; }
    .hero::before { content: ''; position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80') center/cover no-repeat; opacity: 0.22; }
    .hero-content { position: relative; z-index: 1; max-width: 760px; }
    .hero-eyebrow { display: inline-block; color: var(--ice); font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 20px; border: 1px solid rgba(126,200,227,0.4); padding: 6px 18px; border-radius: 100px; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.8rem, 8vw, 5.5rem); color: #fff; line-height: 1.05; margin-bottom: 12px; letter-spacing: -0.01em; }
    .hero h1 em { font-style: italic; color: var(--ice-light); }
    .hero-sub { color: rgba(255,255,255,0.65); font-size: clamp(0.9rem, 2vw, 1.05rem); font-weight: 300; margin-bottom: 48px; line-height: 1.7; }
    .hero-stats { display: flex; gap: 48px; justify-content: center; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { display: block; font-family: 'Playfair Display', serif; font-size: 2rem; color: #fff; line-height: 1; }
    .stat-label { font-size: 0.7rem; color: var(--ice); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
    .hero-scroll { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 0.1em; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }
    .hero-scroll svg { width: 20px; height: 20px; }
    .filters-wrap { position: sticky; top: 61px; z-index: 90; background: rgba(240,242,245,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #dde1e9; padding: 0 24px; }
    .area-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 14px 0 10px; scrollbar-width: none; }
    .area-tabs::-webkit-scrollbar { display: none; }
    .area-btn { flex-shrink: 0; padding: 8px 18px; border-radius: 100px; border: 1.5px solid #c8cdd8; background: #fff; color: #444; font-family: 'Noto Sans JP', sans-serif; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all var(--transition); white-space: nowrap; }
    .area-btn:hover { border-color: var(--navy); color: var(--navy); }
    .area-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .cat-chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
    .cat-chips::-webkit-scrollbar { display: none; }
    .cat-btn { flex-shrink: 0; padding: 5px 14px; border-radius: 100px; border: 1.5px solid transparent; background: #e8ecf2; color: #666; font-family: 'Noto Sans JP', sans-serif; font-size: 0.78rem; cursor: pointer; transition: all var(--transition); }
    .cat-btn:hover { background: #dce1eb; color: #333; }
    .cat-btn.active { border-color: var(--ice); background: rgba(126,200,227,0.15); color: var(--navy); font-weight: 500; }
    .gallery-section { max-width: 1280px; margin: 0 auto; padding: 40px 20px 80px; }
    .gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .gallery-count { font-size: 0.85rem; color: var(--gray); }
    .gallery-count strong { color: var(--navy); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--card-shadow); transition: transform var(--transition), box-shadow var(--transition); opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .card-img-wrap { position: relative; aspect-ratio: 1/1; overflow: hidden; background: #e8ecf2; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img-wrap img { transform: scale(1.05); }
    .card-area-badge { position: absolute; top: 12px; left: 12px; background: rgba(10,15,28,0.75); backdrop-filter: blur(6px); color: var(--ice-light); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 100px; }
    .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,15,28,0.88) 0%, transparent 55%); opacity: 0; transition: opacity var(--transition); display: flex; align-items: flex-end; padding: 20px; }
    .card:hover .card-overlay { opacity: 1; }
    .card-overlay-caption { color: rgba(255,255,255,0.9); font-size: 0.82rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-ig-btn { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; background: rgba(255,255,255,0.15); backdrop-filter: blur(6px); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; opacity: 0; transition: opacity var(--transition), background var(--transition); }
    .card:hover .card-ig-btn { opacity: 1; }
    .card-ig-btn:hover { background: rgba(255,255,255,0.3); }
    .card-ig-btn svg { width: 16px; height: 16px; color: #fff; }
    .card-body { padding: 16px 18px 18px; }
    .card-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { font-size: 0.7rem; padding: 3px 10px; border-radius: 100px; background: #eef2f8; color: #556; font-weight: 500; }
    .tag.グルメ { background: #fff0e8; color: #c05a1f; }
    .tag.観光スポット { background: #e3f2fd; color: #1565c0; }
