<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅人北海道 — 北海道 Instagram Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0a0f1c;
      --navy-mid: #141a2e;
      --ice: #7ec8e3;
      --ice-light: #b8e4f2;
      --white: #f8f9fa;
      --gray: #6c757d;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.10);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      background: rgba(10,15,28,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(126,200,227,0.15);
    }
    .nav-logo {
      font-family: 'Playfair Display', serif; color: #fff;
      font-size: 1.25rem; letter-spacing: 0.15em; text-decoration: none;
    }
    .nav-logo span { color: var(--ice); }
    .nav-ig {
      display: flex; align-items: center; gap: 8px;
      color: var(--ice-light); font-size: 0.8rem;
      text-decoration: none; letter-spacing: 0.05em; transition: color var(--transition);
    }
    .nav-ig:hover { color: #fff; }
    .nav-ig svg { width: 18px; height: 18px; }

    .hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      background: linear-gradient(160deg, #0a0f1c 0%, #0d1f3c 50%, #0a2540 100%);
      overflow: hidden; padding: 120px 24px 80px;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80') center/cover no-repeat;
      opacity: 0.22;
    }
    .hero-content { position: relative; z-index: 1; max-width: 760px; }
    .hero-eyebrow {
      display: inline-block; color: var(--ice); font-size: 0.75rem;
      letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 20px;
      border: 1px solid rgba(126,200,227,0.4); padding: 6px 18px; border-radius: 100px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      color: #fff; line-height: 1.05; margin-bottom: 12px; letter-spacing: -0.01em;
    }
    .hero h1 em { font-style: italic; color: var(--ice-light); }
    .hero-sub {
      color: rgba(255,255,255,0.65); font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 300; margin-bottom: 48px; line-height: 1.7;
    }
    .hero-stats { display: flex; gap: 48px; justify-content: center; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { display: block; font-family: 'Playfair Display', serif; font-size: 2rem; color: #fff; line-height: 1; }
    .stat-label { font-size: 0.7rem; color: var(--ice); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
    .hero-scroll {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 0.1em;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }
    .hero-scroll svg { width: 20px; height: 20px; }

    .filters-wrap {
      position: sticky; top: 61px; z-index: 90;
      background: rgba(240,242,245,0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid #dde1e9; padding: 0 24px;
    }
    .area-tabs {
      display: flex; gap: 4px; overflow-x: auto; padding: 14px 0 10px;
      scrollbar-width: none;
    }
    .area-tabs::-webkit-scrollbar { display: none; }
    .area-btn {
      flex-shrink: 0; padding: 8px 18px; border-radius: 100px;
      border: 1.5px solid #c8cdd8; background: #fff; color: #444;
      font-family: 'Noto Sans JP', sans-serif; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all var(--transition); white-space: nowrap;
    }
    .area-btn:hover { border-color: var(--navy); color: var(--navy); }
    .area-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }

    .cat-chips {
      display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px;
      scrollbar-width: none;
    }
    .cat-chips::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex-shrink: 0; padding: 5px 14px; border-radius: 100px;
      border: 1.5px solid transparent; background: #e8ecf2; color: #666;
      font-family: 'Noto Sans JP', sans-serif; font-size: 0.78rem;
      cursor: pointer; transition: all var(--transition);
    }
    .cat-btn:hover { background: #dce1eb; color: #333; }
    .cat-btn.active { border-color: var(--ice); background: rgba(126,200,227,0.15); color: var(--navy); font-weight: 500; }

    .gallery-section { max-width: 1280px; margin: 0 auto; padding: 40px 20px 80px; }
    .gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .gallery-count { font-size: 0.85rem; color: var(--gray); }
    .gallery-count strong { color: var(--navy); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    .card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .card-img-wrap { position: relative; aspect-ratio: 1/1; overflow: hidden; background: #e8ecf2; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img-wrap img { transform: scale(1.05); }

    .card-area-badge {
      position: absolute; top: 12px; left: 12px;
      background: rgba(10,15,28,0.75); backdrop-filter: blur(6px);
      color: var(--ice-light); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.08em; padding: 4px 10px; border-radius: 100px;
    }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,15,28,0.88) 0%, transparent 55%);
      opacity: 0; transition: opacity var(--transition);
      display: flex; align-items: flex-end; padding: 20px;
    }
    .card:hover .card-overlay { opacity: 1; }
    .card-overlay-caption {
      color: rgba(255,255,255,0.9); font-size: 0.82rem; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-ig-btn {
      position: absolute; top: 12px; right: 12px;
      width: 36px; height: 36px; background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; opacity: 0;
      transition: opacity var(--transition), background var(--transition);
    }
    .card:hover .card-ig-btn { opacity: 1; }
    .card-ig-btn:hover { background: rgba(255,255,255,0.3); }
    .card-ig-btn svg { width: 16px; height: 16px; color: #fff; }

    .card-body { padding: 16px 18px 18px; }
    .card-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { font-size: 0.7rem; padding: 3px 10px; border-radius: 100px; background: #eef2f8; color: #556; font-weight: 500; }
    .tag.グルメ        { background: #fff0e8; color: #c05a1f; }
    .tag.観光スポット   { background: #e3f2fd; color: #1565c0; }
    .tag.宿泊          { background: #fce4ec; color: #c2185b; }
    .tag.イベント       { background: #f3e5f5; color: #7b1fa2; }
    .tag.旅行プラン     { background: #e0f7fa; color: #00695c; }
    .tag.体験          { background: #e8f5ea; color: #2e7d32; }
    .tag.お土産        { background: #fff8e1; color: #f57f17; }
    .tag.温泉          { background: #e1f5fe; color: #0277bd; }

    .card-caption {
      font-size: 0.82rem; color: #444; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 12px;
    }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-date { font-size: 0.72rem; color: #999; }
    .card-likes { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: #c05a1f; }
    .card-likes svg { width: 13px; height: 13px; }

    .loading { grid-column: 1/-1; text-align: center; padding: 80px 24px; color: var(--gray); }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid #dde1e9;
      border-top-color: var(--ice); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .no-results { grid-column: 1/-1; text-align: center; padding: 80px 24px; color: var(--gray); }
    .no-results svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 16px; }

    footer {
      background: var(--navy); color: rgba(255,255,255,0.5);
      text-align: center; padding: 40px 24px; font-size: 0.8rem; line-height: 1.8;
    }
    footer a { color: var(--ice); text-decoration: none; }

    @media (max-width: 768px) {
      nav { padding: 14px 18px; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .gallery-section { padding: 24px 14px 60px; }
    }
    @media (max-width: 480px) {
      .gallery { grid-template-columns: 1fr; }
      .hero-stats { gap: 28px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#"><span>旅人</span> HOKKAIDO</a>
  <a class="nav-ig" href="https://www.instagram.com/tabito_hokkaido" target="_blank">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    @tabito_hokkaido
  </a>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="hero-eyebrow">Hokkaido Travel Guide</div>
    <h1>北の大地の<br><em>絶景と美食</em></h1>
    <p class="hero-sub">北海道の魅力を発信するInstagramギャラリー。<br>エリアとカテゴリで気になる投稿を見つけよう。</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-num" id="stat-posts">0</span><span class="stat-label">投稿数</span></div>
      <div class="stat"><span class="stat-num" id="stat-areas">0</span><span class="stat-label">エリア</span></div>
      <div class="stat"><span class="stat-num" id="stat-cats">0</span><span class="stat-label">カテゴリ</span></div>
    </div>
  </div>
  <div class="hero-scroll">
    <span>SCROLL</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </div>
</section>

<div class="filters-wrap">
  <div class="area-tabs" id="daichiTabs"></div>
  <div class="area-tabs" id="areaTabs" style="padding-top:4px;"></div>
  <div class="cat-chips" id="catChips"></div>
</div>

<section class="gallery-section">
  <div class="gallery-header">
    <div class="gallery-count"><strong id="visibleCount">0</strong> 件の投稿</div>
  </div>
  <div class="gallery" id="gallery">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>投稿を読み込み中...</p>
    </div>
  </div>
</section>

<footer>
  <p style="font-family:'Playfair Display',serif;font-size:1.1rem;color:#fff;margin-bottom:8px;">旅人北海道</p>
  <p>北海道の魅力を発信するInstagramアカウント</p>
  <p style="margin-top:12px;"><a href="https://www.instagram.com/tabito_hokkaido" target="_blank">@tabito_hokkaido</a></p>
  <p style="margin-top:16px;font-size:0.7rem;">Powered by Instagram Graph API + Make.com + GitHub Pages</p>
</footer>

<script>
let allPosts = [];
let activeDaichi = 'すべて';
let activeArea   = 'すべて';
let activeCats   = new Set();

async function loadPosts() {
  try {
    const res = await fetch('./posts.json');
    if (!res.ok) throw new Error('posts.json が見つかりません');
    return await res.json();
  } catch (e) {
    console.warn('posts.json の読み込みに失敗しました:', e.message);
    return [];
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  allPosts = await loadPosts();
  const daichis = [...new Set(allPosts.map(p => p.daichi).filter(Boolean))];
  const areas   = [...new Set(allPosts.map(p => p.area).filter(Boolean))];
  const cats    = [...new Set(allPosts.flatMap(p => p.categories || []).filter(Boolean))];
  animateCount('stat-posts', allPosts.length);
  animateCount('stat-areas', areas.length);
  animateCount('stat-cats',  cats.length);
  buildDaichiTabs(daichis);
  buildAreaTabs(areas);
  buildCatChips(cats);
  renderGallery();
});

function animateCount(id, target) {
  const el = document.getElementById(id);
  let n = 0;
  const step = Math.ceil(target / 30);
  const t = setInterval(() => {
    n = Math.min(n + step, target);
    el.textContent = n;
    if (n >= target) clearInterval(t);
  }, 40);
}

const DAICHI_MAP_JS = {
  '道央': ['札幌','小樽','ニセコ','洞爺','登別','室蘭','苫小牧','岩見沢','新千歳空港','トマム','定山渓'],
  '道東': ['帯広','釧路','網走','知床','北見','紋別','根室'],
  '道南': ['函館','積丹'],
  '道北': ['旭川','富良野','稚内'],
};
function isAreaInDaichi(area, daichi) {
  return (DAICHI_MAP_JS[daichi] || []).includes(area);
}

function buildDaichiTabs(daichis) {
  const wrap = document.getElementById('daichiTabs');
  const ordered = ['道央','道東','道南','道北'].filter(d => daichis.includes(d));
  ['すべて', ...ordered].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'area-btn' + (d === 'すべて' ? ' active' : '');
    btn.textContent = d;
    btn.onclick = () => {
      activeDaichi = d;
      activeArea   = 'すべて';
      document.querySelectorAll('#daichiTabs .area-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#areaTabs .area-btn').forEach(b => {
        const show = d === 'すべて' || isAreaInDaichi(b.textContent, d) || b.textContent === 'すべて';
        b.style.display = show ? '' : 'none';
        if (b.textContent === 'すべて') b.classList.add('active');
        else b.classList.remove('active');
      });
      btn.classList.add('active');
      renderGallery();
    };
    wrap.appendChild(btn);
  });
}

function buildAreaTabs(areas) {
  const wrap = document.getElementById('areaTabs');
  const areasWithOther = [...areas.filter(a => a !== 'その他'), 'その他'];
  ['すべて', ...areasWithOther].forEach(area => {
    const btn = document.createElement('button');
    btn.className = 'area-btn' + (area === 'すべて' ? ' active' : '');
    btn.textContent = area;
    btn.onclick = () => {
      activeArea = area;
      document.querySelectorAll('#areaTabs .area-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGallery();
    };
    wrap.appendChild(btn);
  });
}

function buildCatChips(cats) {
  const wrap = document.getElementById('catChips');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.onclick = () => {
      if (activeCats.has(cat)) { activeCats.delete(cat); btn.classList.remove('active'); }
      else { activeCats.add(cat); btn.classList.add('active'); }
      renderGallery();
    };
    wrap.appendChild(btn);
  });
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  if (allPosts.length === 0) {
    gallery.innerHTML = `<div class="no-results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>投稿データがありません。<br>Make.com の設定が完了すると自動で表示されます。</p>
    </div>`;
    document.getElementById('visibleCount').textContent = 0;
    return;
  }

  const filtered = allPosts.filter(p => {
    const daichiOk = activeDaichi === 'すべて' || p.daichi === activeDaichi;
    const areaOk   = activeArea   === 'すべて' || p.area   === activeArea;
    const catOk    = activeCats.size === 0 || (p.categories || []).some(c => activeCats.has(c));
    return daichiOk && areaOk && catOk;
  });

  document.getElementById('visibleCount').textContent = filtered.length;

  if (filtered.length === 0) {
    gallery.innerHTML = `<div class="no-results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>条件に合う投稿が見つかりませんでした。</p>
    </div>`;
    return;
  }

  filtered.forEach((post, i) => {
    const card  = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${i * 60}ms`;
    const cats   = post.categories || [];
    const imgSrc = post.thumbnail_url || post.media_url || '';
    const likes  = post.likes || 0;
    card.innerHTML = `
      <div class="card-img-wrap">
        ${imgSrc
          ? `<img src="${imgSrc}" alt="${post.area || ''}" loading="lazy">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a2a3a;color:#7ec8e3;font-size:0.8rem;">No Image</div>`
        }
        <div class="card-area-badge">${post.area || ''}</div>
        <div class="card-overlay"><p class="card-overlay-caption">${post.caption || ''}</p></div>
        <a class="card-ig-btn" href="${post.permalink || '#'}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </div>
      <div class="card-body">
        <div class="card-cats">${cats.map(c => `<span class="tag ${c}">${c}</span>`).join('')}</div>
        <p class="card-caption">${post.caption || ''}</p>
        <div class="card-footer">
          <span class="card-date">${post.timestamp ? formatDate(post.timestamp) : ''}</span>
          ${likes > 0 ? `<span class="card-likes">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            ${likes.toLocaleString()}
          </span>` : ''}
        </div>
      </div>`;
    gallery.appendChild(card);
  });
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
</script>
</body>
</html>
