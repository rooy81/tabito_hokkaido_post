<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オススメの宿 — 旅と北海道</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --main:    #c7e1c4;
      --main-dk: #8db88a;
      --accent:  #ff5757;
      --dark:    #1a2418;
      --dark-mid:#2a3828;
      --gray:    #6c7a6c;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.09);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #f2f5f2; color: #1a2418; min-height: 100vh; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: #c7e1c4; border-bottom: 1px solid #aecbab;
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img { height: 32px; width: auto; object-fit: contain; display: block; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-back {
      color: #1a2418; font-size: 0.78rem; text-decoration: none; letter-spacing: 0.04em;
      border: 1.5px solid rgba(26,36,24,0.35); padding: 6px 14px; border-radius: 100px;
      transition: all var(--transition); white-space: nowrap; font-weight: 500;
    }
    .nav-back:hover { background: rgba(26,36,24,0.1); border-color: #1a2418; }
    .nav-social { display: flex; align-items: center; gap: 8px; }
    .nav-icon {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; color: #1a2418;
      text-decoration: none; transition: background var(--transition);
    }
    .nav-icon:hover { background: rgba(26,36,24,0.12); }
    .nav-icon svg { width: 18px; height: 18px; }
    .hero {
      margin-top: 61px; padding: 56px 24px 44px;
      position: relative; overflow: hidden; text-align: center;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background: url('./hotels-hero.jpg') center/cover no-repeat;
    }
    .hero-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(26,36,24,0.52) 0%, rgba(26,36,24,0.38) 50%, rgba(26,36,24,0.58) 100%);
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-eyebrow {
      display: inline-block; color: var(--main); font-size: 0.68rem;
      letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 12px;
      border: 1px solid rgba(199,225,196,0.5); padding: 4px 14px; border-radius: 100px; font-weight: 500;
    }
    .hero h1 {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
      font-size: clamp(1.8rem, 5vw, 3rem); color: #fff; line-height: 1.2; margin-bottom: 12px;
      letter-spacing: 0.04em; text-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }
    .hero-sub { color: rgba(255,255,255,0.88); font-size: 0.9rem; font-weight: 700; line-height: 1.8; max-width: 500px; margin: 0 auto; }
    .filter-bar {
      background: #f2f5f2; border-bottom: 1px solid #dce5dc;
      padding: 10px 20px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 100px; border: 1.5px solid #c5d0c5;
      background: #fff; color: #4a5a4a; font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all var(--transition); white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--dark); color: var(--dark); }
    .filter-btn.active { background: var(--dark); border-color: var(--dark); color: var(--main); }
    .filter-count { margin-left: auto; font-size: 0.75rem; color: var(--gray); white-space: nowrap; }
    .grid-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 72px; }
    .hotel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .hotel-card {
      background: #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--card-shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      cursor: pointer; text-decoration: none; color: inherit; display: block;
    }
    .hotel-card:hover { transform: translateY(-4px); box-shadow: 0 10px 36px rgba(0,0,0,0.13); }
    .card-thumb { position: relative; aspect-ratio: 4/5; overflow: hidden; background: var(--dark-mid); }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .hotel-card:hover .card-thumb img { transform: scale(1.04); }
    .card-thumb-placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; color: rgba(199,225,196,0.5); font-size: 0.8rem;
    }
    .play-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.15); transition: background var(--transition);
    }
    .hotel-card:hover .play-overlay { background: rgba(0,0,0,0.25); }
    .play-btn {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.88);
      display: flex; align-items: center; justify-content: center; transition: transform var(--transition);
    }
    .hotel-card:hover .play-btn { transform: scale(1.1); }
    .play-btn svg { width: 18px; height: 18px; fill: var(--dark); margin-left: 3px; }
    .area-badge {
      position: absolute; top: 10px; left: 10px; background: rgba(26,36,24,0.75);
      backdrop-filter: blur(6px); color: var(--main); font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.07em; padding: 3px 9px; border-radius: 100px;
    }
    .price-badge {
      position: absolute; bottom: 10px; right: 10px; background: rgba(26,36,24,0.75);
      backdrop-filter: blur(6px); border-radius: 8px; padding: 3px 9px;
    }
    .price-badge span { font-size: 11px; color: #fff; font-weight: 600; }
    .card-body { padding: 13px 15px 15px; }
    .card-name { font-size: 0.92rem; font-weight: 700; color: #1a2418; margin-bottom: 6px; line-height: 1.4; }
    .card-comment { font-size: 0.78rem; color: #555; line-height: 1.6; border-left: 3px solid var(--main-dk); padding-left: 9px; font-style: italic; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { font-size: 0.68rem; padding: 2px 9px; border-radius: 100px; background: #edf2ed; color: #4a5a4a; font-weight: 500; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.78);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 18px; overflow: hidden; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal-head { background: var(--dark); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
    .modal-head h3 { color: #fff; font-size: 0.88rem; font-weight: 600; }
    .modal-close { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 1.3rem; line-height: 1; padding: 0 4px; }
    .modal-close:hover { color: #fff; }
    .modal-embed { aspect-ratio: 4/5; background: #000; overflow: hidden; position: relative; }
    .modal-embed iframe { position: absolute; top: 50%; left: 50%; width: 100%; height: 142%; transform: translate(-50%, -50%); border: none; }
    .modal-embed img { width: 100%; height: 100%; object-fit: cover; }
    .modal-info { padding: 16px 18px; }
    .modal-name { font-size: 0.98rem; font-weight: 700; margin-bottom: 8px; }
    .modal-comment { font-size: 0.8rem; color: #555; line-height: 1.65; border-left: 3px solid var(--main-dk); padding-left: 9px; font-style: italic; margin-bottom: 12px; }
    .modal-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .modal-area { font-size: 0.75rem; background: #edf2ed; color: #3a5a38; padding: 3px 10px; border-radius: 100px; font-weight: 600; }
    .modal-price { font-size: 0.84rem; color: #444; }
    .modal-price b { color: var(--dark); font-size: 1rem; }
    .modal-tiktok-link {
      display: inline-flex; align-items: center; gap: 6px; background: var(--dark); color: #fff;
      font-size: 0.76rem; padding: 8px 16px; border-radius: 8px; text-decoration: none;
      margin-top: 12px; font-weight: 600; transition: background 0.2s;
    }
    .modal-tiktok-link:hover { background: #2a3828; }
    .modal-tiktok-link svg { width: 14px; height: 14px; fill: #fff; }
    .empty-state { text-align: center; padding: 72px 20px; color: var(--gray); display: none; }
    .empty-state.show { display: block; }
    footer { background: var(--dark); color: rgba(255,255,255,0.45); text-align: center; padding: 36px 24px; font-size: 0.78rem; line-height: 1.8; }
    footer a { color: var(--main); text-decoration: none; }
    @media (max-width: 768px) {
      nav { padding: 12px 16px; }
      .nav-logo img { height: 26px; }
      .nav-back { display: none; }
      .hotel-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .grid-wrap { padding: 20px 12px 60px; }
      .filter-bar { padding: 8px 12px; }
      .hero { padding: 36px 20px 28px; }
    }
    @media (max-width: 400px) {
      .hotel-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card-body { padding: 10px 11px 12px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html"><img src="./logo.jpg" alt="旅と北海道"></a>
  <div class="nav-right">
    <a class="nav-back" href="index.html">← ギャラリーへ</a>
    <div class="nav-social">
      <a class="nav-icon" href="https://www.tiktok.com/@tabito_hokkaido" target="_blank" rel="noopener" title="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.91a8.2 8.2 0 004.79 1.53V7a4.85 4.85 0 01-1.02-.31z"/></svg>
      </a>
      <a class="nav-icon" href="https://www.instagram.com/tabito_hokkaido" target="_blank" rel="noopener" title="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <span class="hero-eyebrow">Roy's Pick</span>
    <h1>北海道で泊まるならココ</h1>
    <p class="hero-sub">実際に泊まった宿だけを紹介！<br>TikTokで予約すると、楽天ポイント4000pt還元！<br>更に、20%OFFになるキャンペーンも随時実施中🔥</p>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-area="all" onclick="filterArea('all',this)">すべて</button>
  <span class="filter-count" id="filterCount">0件</span>
</div>

<div class="grid-wrap">
  <div class="hotel-grid" id="hotelGrid">
    <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--gray);">読み込み中…</div>
  </div>
  <div class="empty-state" id="emptyState">
    <p style="font-size:2rem;margin-bottom:10px;">🏨</p>
    <p>該当する宿がありません</p>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="handleModalClick(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalName"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-embed" id="modalEmbed"></div>
    <div class="modal-info">
      <p class="modal-comment" id="modalComment"></p>
      <div class="modal-meta">
        <span class="modal-area" id="modalArea"></span>
        <span class="modal-price" id="modalPrice"></span>
      </div>
      <a class="modal-tiktok-link" id="modalLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.91a8.2 8.2 0 004.79 1.53V7a4.85 4.85 0 01-1.02-.31z"/></svg>
        TikTokで見る
      </a>
    </div>
  </div>
</div>

<footer>
  <p style="font-size:1rem;color:#fff;margin-bottom:6px;">旅と北海道</p>
  <p>北海道の魅力を発信するInstagram・TikTokアカウント</p>
  <p style="margin-top:10px;">
    <a href="https://www.instagram.com/tabito_hokkaido" target="_blank">@tabito_hokkaido</a>
    &nbsp;／&nbsp;
    <a href="https://www.tiktok.com/@tabito_hokkaido" target="_blank">TikTok</a>
  </p>
</footer>

<script>
const GITHUB_REPO = 'rooy81/tabito_hokkaido_post';
const HOTELS_FILE = 'hotels.json';
let allHotels = [];

async function loadHotels() {
  try {
    const url = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/${HOTELS_FILE}?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('not found');
    allHotels = await res.json();
  } catch(e) { allHotels = []; }

  // TikTok oEmbedから最新サムネイルを取得（CDN URLの期限切れ対策）
  await Promise.all(allHotels.map(async h => {
    if (!h.tiktok_url) return;
    try {
      const r = await fetch(`https://www.tiktok.com/oembed?url=${encodeURIComponent(h.tiktok_url)}`);
      const d = await r.json();
      if (d.thumbnail_url) h.thumbnail_url = d.thumbnail_url;
    } catch(e) {}
  }));

  buildFilters();
  renderCards(allHotels);
}

function buildFilters() {
  const bar = document.getElementById('filterBar');
  const areas = [...new Set(allHotels.map(h => h.area).filter(Boolean))];
  const countSpan = document.getElementById('filterCount');
  bar.querySelectorAll('[data-area]:not([data-area="all"])').forEach(e => e.remove());
  areas.forEach(area => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.area = area;
    btn.textContent = area;
    btn.onclick = () => filterArea(area, btn);
    countSpan.before(btn);
  });
}

function filterArea(area, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const filtered = area === 'all' ? allHotels : allHotels.filter(h => h.area === area);
  renderCards(filtered);
}

function renderCards(hotels) {
  const grid = document.getElementById('hotelGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('filterCount');
  grid.innerHTML = '';
  count.textContent = hotels.length + '件';

  if (hotels.length === 0) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  hotels.forEach(h => {
    const card = document.createElement('a');
    card.className = 'hotel-card';
    card.href = h.tiktok_url || '#';
    card.target = '_blank';
    card.rel = 'noopener';

    const priceStr = h.price_from ? `¥${Number(h.price_from).toLocaleString()}〜` : '';
    const tagsHtml = (h.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

    card.innerHTML = `
      <div class="card-thumb">
        ${h.thumbnail_url
          ? `<img src="${h.thumbnail_url}" alt="${h.hotel_name}" loading="lazy">`
          : `<div class="card-thumb-placeholder"><span style="font-size:2rem">🏨</span><span>TikTok動画</span></div>`
        }
        <div class="play-overlay">
          <div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
        </div>
        ${h.area ? `<div class="area-badge">${h.area}</div>` : ''}
        ${priceStr ? `<div class="price-badge"><span>${priceStr}</span></div>` : ''}
      </div>
      <div class="card-body">
        <p class="card-name">${h.hotel_name || ''}</p>
        ${h.comment ? `<p class="card-comment">${h.comment}</p>` : ''}
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      </div>`;
    grid.appendChild(card);
  });
}

function openModal(h) {
  const tikId = h.video_id || (h.tiktok_url && h.tiktok_url.match(/video\/(\d+)/)?.[1]);
  document.getElementById('modalName').textContent = h.hotel_name || '';
  document.getElementById('modalComment').textContent = h.comment || '';
  document.getElementById('modalArea').textContent = h.area || '';
  document.getElementById('modalPrice').innerHTML = h.price_from
    ? `¥<b>${Number(h.price_from).toLocaleString()}</b>〜/泊` : '';
  document.getElementById('modalLink').href = h.tiktok_url || '#';

  const embed = document.getElementById('modalEmbed');
  if (tikId) {
    embed.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${tikId}" allowfullscreen allow="encrypted-media"></iframe>`;
  } else if (h.thumbnail_url) {
    embed.innerHTML = `<img src="${h.thumbnail_url}" alt="${h.hotel_name}">`;
  } else {
    embed.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-size:0.9rem;">動画を読み込めませんでした</div>`;
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalEmbed').innerHTML = '';
  document.body.style.overflow = '';
}

function handleModalClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

loadHotels();
</script>
</body>
</html>
